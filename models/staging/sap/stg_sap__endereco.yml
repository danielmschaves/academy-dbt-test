version: 2

models:
  - name: stg_sap__endereco
    description: >
      Endereços de clientes, funcionários e fornecedores (address).
      Referencia estado via ID_ESTADO; cidade e CEP ficam nesta tabela.
    columns:
      - name: ID_ENDERECO
        description: Chave primária do endereço.
        tests:
          - unique
          - not_null
      - name: ID_ESTADO
        description: Chave estrangeira para estado/província.
      - name: ENDERECO_1
        description: Primeira linha do endereço.
      - name: ENDERECO_2
        description: Segunda linha do endereço (complemento).
      - name: CIDADE
        description: Nome da cidade.
      - name: CEP
        description: Código postal.
      - name: LOCALIZACAO_ESPACIAL
        description: Coordenadas geográficas do endereço.
      - name: DATA_MODIFICACAO
        description: Data da última modificação do registro.
      - name: ID_LINHA_UNICO
        description: Identificador único global do registro (rowguid).
