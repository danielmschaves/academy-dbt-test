[project]
name = "academy-dbt-test"
version = "0.1.0"
description = "dbt + BigQuery analytics project for Adventure Works SAP data"
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.9",
    "dbt-bigquery>=1.9",
    "python-dotenv>=1",
]

[dependency-groups]
dev = [
    "pre-commit>=4",
    "sqlfluff>=3",
    "sqlfluff-templater-dbt>=3",
]

[tool.uv]
package = false
